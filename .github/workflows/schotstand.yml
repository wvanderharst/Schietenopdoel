name: Schotstand bijwerken en publiceren

on:
  schedule:
    - cron: "17 6 * * *"   # dagelijks 06:17 UTC
  workflow_dispatch:
    inputs:
      vernieuw:
        description: "Alle seizoenen opnieuw ophalen"
        type: boolean
        default: false
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: schotstand
  cancel-in-progress: false

jobs:
  bijwerken:
    runs-on: ubuntu-latest
    steps:
      # Altijd de nieuwste main, ook als de run in de wachtrij stond.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Database bijwerken
        if: github.event_name != 'push'
        # Haalt ontbrekende seizoenen plus het huidige en vorige seizoen op.
        # Exitcode 2 = een of meer downloads mislukt, de rest is wel geschreven.
        run: python3 scripts/database.py ${{ inputs.vernieuw && '--vernieuw' || '' }} || [ $? -eq 2 ]

      - name: Nieuwe data committen
        if: github.event_name != 'push'
        run: |
          if git diff --quiet -- data/; then
            echo "Geen nieuwe data."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "Data bijgewerkt $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push origin HEAD:main

      # GitHub Pages serveert de branch gh-pages (wordt automatisch aangezet
      # zodra die branch bestaat).
      - name: Site publiceren naar gh-pages
        run: |
          mkdir _site
          mkdir -p data
          cp -r index.html style.css app.js data _site/
          touch _site/.nojekyll
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898333+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Site $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
